#!MANAGED-CONFIG __MANAGED_CONFIG_URL__ interval=86400 strict=false
# Surge 主配置模板：Sub-Store 节点 + GitHub 动态规则
# 占位符由私有 VPS 渲染服务注入；不要在公开仓库填写真实链接。

[General]
dns-server = 101.96.200.113:8844, 194.114.138.29:8844, 179.253.254.37:8844
ipv6 = true

[Proxy]

[Proxy Group]
# Sub-Store 动态提供全部节点。
Proxy = select, policy-path="__SUBSTORE_URL__", update-interval=86400, DIRECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png

# 按节点名称筛选；关键词来自当前节点命名规则。
TX = select, REJECT, DIRECT, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])tx($|[-_ =])", icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/tencent.png
Boom = select, include-other-group=Proxy, United States, TX, policy-regex-filter="(?i)(boom|hy2)", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
# 汇总手工命名和常见运营商家宽节点；Google/Gemini 现在改用 TaiWan。
HomeProxy = select, include-other-group=Proxy, policy-regex-filter="(?i)(homeproxy|hkbn|hkt|pccw|netvigator|wtt|icable|i-cable|smartone|hgc|cmhk|hinet|chunghwa|seednet|fetnet|fareastone|taiwan mobile|twmbroadband|softbank|docomo|nuro|iij|biglobe|plala|rakuten|ocn|singtel|starhub|myrepublic|viewqwest|at&t|verizon|comcast|xfinity|spectrum|charter|cox|frontier|centurylink|quantum fiber|optimum|t-mobile|tmobile|(^|[-_ =])(cht|m1|att|ntt)($|[-_ =]))", icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Apple_Home.png
Singapore = select, include-other-group=Proxy, policy-regex-filter="(?i)(singapore|新加坡|singtel|starhub|myrepublic|viewqwest|(^|[-_ =])m1($|[-_ =])|sg)", icon-url=https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/120px/SG.png
HongKong = select, include-other-group=Proxy, policy-regex-filter="(?i)(hongkong|hong-kong|香港|hkbn|hkt|pccw|netvigator|wtt|icable|i-cable|smartone|hgc|cmhk|(^|[-_ =])hk($|[-_ =]))", icon-url=https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/120px/HK.png
TaiWan Nodes = select, include-other-group=Proxy, policy-regex-filter="(?i)(taiwan|tai-wan|台湾|台灣|hinet|chunghwa|seednet|fetnet|fareastone|taiwan mobile|twmbroadband|(^|[-_ =])(cht|tw)($|[-_ =]))", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TW.png
# 默认使用台湾节点；Proxy 是手动备用。Google 与 Gemini 都引用该外层组以保持出口一致。
TaiWan = select, TaiWan Nodes, Proxy, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TW.png
# 非 Gemini AI 可在家宽出口与台湾节点之间手动选择。
AI Suite = select, HomeProxy, TaiWan, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png
CTM = select, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])ctm($|[-_ =])", icon-url=https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/120px/MO.png
United States = select, include-other-group=Proxy, policy-regex-filter="(?i)(at&t|verizon|comcast|xfinity|spectrum|charter|cox|frontier|centurylink|quantum fiber|optimum|t-mobile|tmobile|(^|[-_ =])(att|us|usa|lax|los angeles|united states|美国)($|[-_ =]))", icon-url=https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/120px/US.png
Japan = select, include-other-group=Proxy, policy-regex-filter="(?i)(softbank|docomo|(^|[-_ =])(ntt|nuro|iij|biglobe|plala|rakuten|ocn|japan|jp|日本)($|[-_ =]))", icon-url=https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/120px/JP.png
TikTok = select, include-other-group=Proxy, Japan, DIRECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png
Bilibili = select, REJECT, DIRECT, HongKong, TaiWan, CTM, HomeProxy, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili.png

[Rule]
# User preference: reject rules take precedence over all service routing.
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/reject.list,REJECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising_All_No_Resolve.list,REJECT
# 手动选择 REJECT / DIRECT / HongKong / TaiWan / CTM / HomeProxy；必须先于通用直连规则。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/generated/bilibili.list,Bilibili,extended-matching
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/local.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/direct.list,DIRECT
# Sukka 国内域名与中国大陆 IP；rules/generated/cn.list 暂作本地副本，不在此处引用。
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT,extended-matching
