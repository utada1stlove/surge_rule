# Surge 主配置：Sub-Store 节点 + GitHub 动态规则
# 此文件包含测试用 Sub-Store 链接；链接失效后替换 policy-path。

[General]
dns-server = system, 1.1.1.1
ipv6 = true

[Proxy]

[Proxy Group]
# Sub-Store 动态提供全部节点。
Proxy = select, policy-path="https://substore.latexme.de/share/col/surge-main?token=12312asd1231", update-interval=86400, DIRECT

# 按节点名称筛选；关键词来自当前节点命名规则。
Boom = select, include-other-group=Proxy, policy-regex-filter="boom"
HomeProxy = select, include-other-group=Proxy, policy-regex-filter="(?i)homeproxy"
Singapore = select, include-other-group=Proxy, policy-regex-filter="(?i)(singapore|新加坡|sg)"
HongKong = select, include-other-group=Proxy, policy-regex-filter="(?i)(hongkong|hong-kong|香港|hk)"
CTM = select, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])ctm($|[-_ =])"
US = select, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])(us|usa|lax|los angeles|united states|美国)($|[-_ =])"

[Rule]
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/reject.list,REJECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising_All_No_Resolve.list,REJECT
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/nsfw.list,Boom
# Mature upstream set: domains, IP ranges, and Telegram clients.
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list,Boom,extended-matching
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Gemini/Gemini.list,HomeProxy,extended-matching
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list,Singapore,extended-matching
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Anthropic/Anthropic.list,Singapore,extended-matching
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Claude/Claude.list,Singapore,extended-matching
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list,Proxy,extended-matching
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/google-ai.list,HomeProxy
