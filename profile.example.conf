#!MANAGED-CONFIG https://raw.githubusercontent.com/USER/REPO/main/profile.example.conf interval=86400 strict=false

[General]
dns-server = system, 1.1.1.1

[Proxy]
# Replace this placeholder with your own proxy policy.
# Do not commit real passwords, tokens, or subscription URLs.
Proxy-Placeholder = https, proxy.example.com, 443, username, password

[Proxy Group]
Proxy = select, Proxy-Placeholder, DIRECT

[Rule]
RULE-SET,https://raw.githubusercontent.com/USER/REPO/main/rules/direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/USER/REPO/main/rules/reject.list,REJECT
RULE-SET,https://raw.githubusercontent.com/USER/REPO/main/rules/proxy.list,Proxy
FINAL,DIRECT
