name: Sync generated geosite rules

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Loyalsoldier geosite.dat
        run: curl --fail --location --retry 3 --output /tmp/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
      - name: Generate one Surge file per geosite
        run: node scripts/generate-geosite.mjs --input /tmp/geosite.dat --manifest config/geosite-manifest.json --output rules/generated
      - name: Validate generated rules
        run: |
          test -n "$(find rules/generated -maxdepth 1 -type f -name '*.list' -print -quit)"
          ! rg -n 'category-games|geosite:gfw|(^|,) (DIRECT|Proxy|REJECT)$' rules/generated
          node scripts/audit-geosite-policy.mjs .
          git diff --check
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rules/generated
          git diff --cached --quiet || git commit -m "chore: sync generated geosite rules"
          git push
