# Surge rule section for Sub-Store output.
# Paste these lines into the generated Surge profile's [Rule] section.
# Replace Proxy with the actual proxy-group name generated by your Sub-Store template.

RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/reject.list,REJECT
# Upstream advertising list; remove this line if false positives are too high.
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising_All_No_Resolve.list,REJECT
# Mature upstream set: domains, IP ranges, and Telegram clients.
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list,Boom,extended-matching
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/google-ai.list,HomeProxy
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/ai-other.list,Singapore
# Mature upstream set: YouTube domains, IP ranges, and User-Agent rules.
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTube/YouTube.list,CTM,extended-matching
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/finance.list,HongKong
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/social-sg.list,Singapore
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/us-services.list,US
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/proxy.list,Proxy
FINAL,DIRECT
