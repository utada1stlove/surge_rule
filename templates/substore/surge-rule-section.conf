# Surge rule section for Sub-Store output.
# Paste these lines into the generated Surge profile's [Rule] section.
# Replace Proxy with the actual proxy-group name generated by your Sub-Store template.

# User preference: reject rules take precedence over all service routing.
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/reject.list,REJECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising_All_No_Resolve.list,REJECT
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/direct.list,DIRECT
# Sukka 国内域名与中国大陆 IP；rules/generated/cn.list 暂作本地副本，不在此处引用。
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/google-cn.txt,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,United States,extended-matching
# Explicit fallback for the YouTube API endpoint before broad Google matching.
DOMAIN-SUFFIX,youtubei.googleapis.com,CTM
# YouTube must precede reject/advertising sets so ads.youtube.com is also CTM.
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/generated/youtube.list,CTM,extended-matching
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/nsfw.list,Boom
# Mature upstream set: domains, IP ranges, and Telegram clients.
