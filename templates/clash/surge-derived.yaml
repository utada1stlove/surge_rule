# Clash Verge / Mihomo template derived from profiles/surge/surge.conf
# Source date: 2026-09-26; source profile version: 1.3.8.
# Replace __PROXY_SUBSCRIPTION_URL__ before importing.
# The Surge source and its private LAN DNS server are intentionally not copied.
# Smart groups are manual selections because Surge policy-priority is not available in Mihomo.
mixed-port: 7890
mode: rule
ipv6: true
proxies: []

proxy-providers:
  subscription:
    type: http
    url: "__PROXY_SUBSCRIPTION_URL__"
    path: ./proxy_providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: "All Nodes"
    type: select
    use: [subscription]
    proxies: [DIRECT]
  - name: "HongKong"
    type: select
    use: [subscription]
    filter: '(?i)(hongkong|hong-kong|香港|hkbn|hkt|pccw|netvigator|wtt|icable|i-cable|smartone|hgc|cmhk|(^|[-_ =\[\]])hk($|[-_ =\[\]]))'
  - name: "Singapore"
    type: select
    use: [subscription]
    filter: '(?i)(singapore|新加坡|singtel|starhub|myrepublic|viewqwest|(^|[-_ =\[\]])m1($|[-_ =\[\]])|sg)'
  - name: "Japan"
    type: select
    use: [subscription]
    filter: '(?i)(softbank|docomo|(^|[-_ =\[\]])(ntt|nuro|iij|biglobe|plala|rakuten|ocn|japan|jp|日本)($|[-_ =\[\]]))'
  - name: "United States"
    type: select
    use: [subscription]
    filter: '(?i)(at&t|verizon|comcast|xfinity|spectrum|charter|cox|frontier|centurylink|quantum fiber|optimum|t-mobile|tmobile|(^|[-_ =\[\]])(att|us|usa|lax|los angeles|united states|美国)($|[-_ =\[\]]))'
  - name: "TaiWan Nodes"
    type: select
    use: [subscription]
    filter: '(?i)(taiwan|tai-wan|台湾|台灣|hinet|chunghwa|seednet|fetnet|fareastone|taiwan mobile|twmbroadband|(^|[-_ =\[\]])(cht|tw)($|[-_ =\[\]]))'
  - name: "CTM"
    type: select
    use: [subscription]
    filter: '(?i)(^|[-_ =\[\]])ctm($|[-_ =\[\]])'
  - name: "Smart"
    type: select
    use: [subscription]
  - name: "Smart-Unlimited"
    type: select
    use: [subscription]
    filter: '[Tt][Xx]|[Aa][Ww][Ss]|[Cc][Ff][Tt]|[Jj][Pp].*[Hh][Yy]2'
  - name: "Smart-US"
    type: select
    use: [subscription]
    filter: '[Ll][Aa][Xx]'
  - name: "HomeProxy"
    type: select
    use: [subscription]
    proxies: [Smart, Smart-Unlimited, Smart-US]
    filter: '(?i)(homeproxy|hkbn|hkt|pccw|netvigator|wtt|icable|i-cable|smartone|hgc|cmhk|hinet|chunghwa|seednet|fetnet|fareastone|taiwan mobile|twmbroadband|softbank|docomo|nuro|iij|biglobe|plala|rakuten|ocn|singtel|starhub|myrepublic|viewqwest|at&t|verizon|comcast|xfinity|spectrum|charter|cox|frontier|centurylink|quantum fiber|optimum|t-mobile|tmobile|(^|[-_ =\[\]])(cht|m1|att|ntt)($|[-_ =\[\]]))'
  - name: "TX"
    type: select
    use: [subscription]
    proxies: [Smart, Smart-Unlimited, Smart-US, REJECT, DIRECT]
    filter: '(?i)(^|[-_ =\[\]])tx($|[-_ =\[\]])'
  - name: "UnlimitedTurbo"
    type: select
    use: [subscription]
    proxies: [Smart, Smart-Unlimited, Smart-US, United States, TX]
    filter: '(?i)(boom|hy2|aws|cft)'
  - name: "TaiWan"
    type: select
    proxies: [TaiWan Nodes, Smart, Smart-Unlimited, Smart-US, HomeProxy, TX, UnlimitedTurbo, HongKong, CTM, Singapore, Japan, United States, DIRECT]
  - name: "Proxy"
    type: select
    proxies: ["Smart", "Smart-Unlimited", "Smart-US", "HomeProxy", "TX", "UnlimitedTurbo", "HongKong", "CTM", "TaiWan", "Singapore", "Japan", "United States", "DIRECT"]
  - name: "Domestic"
    type: select
    proxies: ["Smart", "Smart-Unlimited", "Smart-US", "HomeProxy", "TX", "UnlimitedTurbo", "HongKong", "CTM", "TaiWan", "Singapore", "Japan", "United States", "DIRECT", "Proxy"]
  - name: "Apple"
