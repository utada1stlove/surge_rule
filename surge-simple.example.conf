#!MANAGED-CONFIG __MANAGED_CONFIG_URL__ interval=86400 strict=false
# Surge 简单配置模板：保持 DIRECT、Proxy、REJECT 三种最终结果，
# 但将可人工调整的流量分为 Domestic、Apple、Others。
#
# Proxy 通过 policy-path 加载订阅中的多个节点，并可在 Surge 中手动切换。
# 使用前必须替换示例订阅地址；不要把真实订阅 URL 或 Token 提交到公开仓库。

[General]
dns-server = 101.96.200.113:8844, 194.114.138.29:8844, 179.253.254.37:8844
ipv6 = true

[Proxy]
# 节点由下面的 Proxy 策略组从远程订阅动态加载。

[Proxy Group]
# 节点订阅；以下策略组会复用其中当前选定的节点。
Proxy = select, policy-path="__SUBSTORE_URL__", update-interval=86400, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/proxy.png
# 国内服务默认直连；需要时可在 Surge 中切换到 Proxy。
Domestic = select, DIRECT, Proxy, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/domestic.png
# Apple 服务默认直连；App Store 等出现区域或连通性问题时可切换到 Proxy。
Apple = select, DIRECT, Proxy, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/apple.png
# 未分类流量默认代理；诊断时可手动切换到 DIRECT。
Others = select, Proxy, DIRECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/global.png

[Rule]
# 明确拒绝优先于其他分类，避免广告域名被国内规则放行。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/reject.list,REJECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising_All_No_Resolve.list,REJECT

# 局域网与本机地址始终直连，不受策略组选择影响。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/local.list,DIRECT

# 国内服务默认直连；可以在 Domestic 组中临时改走 Proxy。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/direct.list,Domestic
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,Domestic,extended-matching
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip.conf,Domestic
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/google-cn.txt,Domestic

# Apple 默认直连；可以在 Apple 组中改走 Proxy。
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,Apple,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,Apple,extended-matching

# 其余流量进入 Others；默认代理，诊断时可手动直连。
FINAL,Others
