#!MANAGED-CONFIG __MANAGED_CONFIG_URL__ interval=86400 strict=false
# Surge 简单配置模板：只有 DIRECT、Proxy、REJECT 三种路由结果
#
# Proxy 通过 policy-path 加载订阅中的多个节点，并可在 Surge 中手动切换。
# 使用前必须替换示例订阅地址；不要把真实订阅 URL 或 Token 提交到公开仓库。

[General]
dns-server = system, 1.1.1.1
ipv6 = true

[Proxy]
# 节点由下面的 Proxy 策略组从远程订阅动态加载。

[Proxy Group]
# 替换为 Sub-Store 输出的 Surge 节点订阅链接。
Proxy = select, policy-path="__SUBSTORE_URL__", update-interval=86400

[Rule]
# 明确直连：自有规则、国内域名与中国大陆 IP。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/direct.list,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/google-cn.txt,DIRECT

# 明确拒绝：自有拦截规则与 BlackMatrix7 广告规则。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/reject.list,REJECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising_All_No_Resolve.list,REJECT

# 其余流量全部进入 Proxy；具体使用哪个节点由你在 Proxy 组中选择。
FINAL,Proxy
