#!MANAGED-CONFIG __MANAGED_CONFIG_URL__ interval=86400 strict=false
# Surgeion 独立配置模板
# 本文件不修改 surge-main.conf；节点订阅由私有渲染服务注入。

[General]
# 全局 DNS 候选；Surge 会按自身机制选择可用服务器，不会按规则自动分组。
dns-server = 101.96.200.113:8844, 179.253.254.37:8844, 194.114.138.29:8844, 223.5.5.5, 1.1.1.1, 8.8.8.8
ipv6 = true

[Proxy]

[Proxy Group]
# 将占位符替换为自己的 Sub-Store Surge 输出地址。
Proxy = select, policy-path="__SUBSTORE_URL__", update-interval=86400, DIRECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/proxy.png
# 自动测速组：分别覆盖 TX、CFT、美国节点和全体节点。
Smart = url-test, include-other-group=Proxy, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/proxy.png
Smart-TX = url-test, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])tx($|[-_ =])", url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/tencent.png
Smart-CFT = url-test, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])cft($|[-_ =])", url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/proxy.png
Smart-US = url-test, include-other-group=Proxy, policy-regex-filter="(?i)(at&t|verizon|comcast|xfinity|spectrum|charter|cox|frontier|centurylink|quantum fiber|optimum|t-mobile|tmobile|(^|[-_ =])(att|us|usa|lax|los angeles|united states|美国)($|[-_ =]))", url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/flags/us.png
Domestic = select, Smart, DIRECT, Proxy, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/domestic.png
Apple = select, Smart, DIRECT, Proxy, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/apple.png
# 与 surge-main.conf 保持一致的策略组。
TX = select, Smart, REJECT, DIRECT, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])tx($|[-_ =])", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/tencent.png
Boom = select, Smart, include-other-group=Proxy, United States, TX, policy-regex-filter="(?i)(boom|hy2)", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/proxy.png
# Boom 是底层的大流量/Hy2 节点池；业务组可以将它作为默认出口。
Cloud = select, Smart, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/cloud.png
Private = select, Smart, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/lock.png
Twitch = select, Smart, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/twitch.png
Spotify = select, Smart, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/spotify.png
YouTube = select, Smart, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/youtube.png
Finance = select, Smart, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/finance-daily.png
PayPal = select, Smart, United States, Singapore, HongKong, TaiWan, Japan, HomeProxy, Proxy, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/PayPal.png
HomeProxy = select, Smart, include-other-group=Proxy, policy-regex-filter="(?i)(homeproxy|hkbn|hkt|pccw|netvigator|wtt|icable|i-cable|smartone|hgc|cmhk|hinet|chunghwa|seednet|fetnet|fareastone|taiwan mobile|twmbroadband|softbank|docomo|nuro|iij|biglobe|plala|rakuten|ocn|singtel|starhub|myrepublic|viewqwest|at&t|verizon|comcast|xfinity|spectrum|charter|cox|frontier|centurylink|quantum fiber|optimum|t-mobile|tmobile|(^|[-_ =])(cht|m1|att|ntt)($|[-_ =]))", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/home.png
Singapore = select, Smart, include-other-group=Proxy, policy-regex-filter="(?i)(singapore|新加坡|singtel|starhub|myrepublic|viewqwest|(^|[-_ =])m1($|[-_ =])|sg)", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/flags/sg.png
HongKong = select, Smart, include-other-group=Proxy, policy-regex-filter="(?i)(hongkong|hong-kong|香港|hkbn|hkt|pccw|netvigator|wtt|icable|i-cable|smartone|hgc|cmhk|(^|[-_ =])hk($|[-_ =]))", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/flags/hk.png
TaiWan Nodes = select, Smart, include-other-group=Proxy, policy-regex-filter="(?i)(taiwan|tai-wan|台湾|台灣|hinet|chunghwa|seednet|fetnet|fareastone|taiwan mobile|twmbroadband|(^|[-_ =])(cht|tw)($|[-_ =]))", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/flags/tw.png
