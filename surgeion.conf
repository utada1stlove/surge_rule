#!MANAGED-CONFIG __MANAGED_CONFIG_URL__ interval=86400 strict=false
# Surgeion 独立配置模板
# 本文件不修改 surge-main.conf；节点订阅和家庭 Wi-Fi 名称均需按本地环境填写。

[General]
# 全局 DNS 候选；Surge 会按自身机制选择可用服务器，不会按规则自动分组。
dns-server = 101.96.200.113:8844, 179.253.254.37:8844, 194.114.138.29:8844, 223.5.5.5, 1.1.1.1, 8.8.8.8
ipv6 = true

[Proxy]

[Proxy Group]
# 将占位符替换为自己的 Sub-Store Surge 输出地址。
Proxy = select, policy-path="__SUBSTORE_URL__", update-interval=86400, DIRECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
Domestic = select, DIRECT, Proxy, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Domestic.png
Apple = select, DIRECT, Proxy, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
# 与 surge-main.conf 保持一致的策略组。
TX = select, REJECT, DIRECT, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])tx($|[-_ =])", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
Boom = select, include-other-group=Proxy, United States, TX, policy-regex-filter="(?i)(boom|hy2)", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
# Boom 是底层的大流量/Hy2 节点池；业务组可以将它作为默认出口。
Cloud = select, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Dropbox.png
Private = select, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Lock.png
Twitch = select, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Streaming.png
Spotify = select, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
HomeProxy = select, include-other-group=Proxy, policy-regex-filter="(?i)(homeproxy|hkbn|hkt|pccw|netvigator|wtt|icable|i-cable|smartone|hgc|cmhk|hinet|chunghwa|seednet|fetnet|fareastone|taiwan mobile|twmbroadband|softbank|docomo|nuro|iij|biglobe|plala|rakuten|ocn|singtel|starhub|myrepublic|viewqwest|at&t|verizon|comcast|xfinity|spectrum|charter|cox|frontier|centurylink|quantum fiber|optimum|t-mobile|tmobile|(^|[-_ =])(cht|m1|att|ntt)($|[-_ =]))", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Home.png
Singapore = select, include-other-group=Proxy, policy-regex-filter="(?i)(singapore|新加坡|singtel|starhub|myrepublic|viewqwest|(^|[-_ =])m1($|[-_ =])|sg)", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/SG.png
HongKong = select, include-other-group=Proxy, policy-regex-filter="(?i)(hongkong|hong-kong|香港|hkbn|hkt|pccw|netvigator|wtt|icable|i-cable|smartone|hgc|cmhk|(^|[-_ =])hk($|[-_ =]))", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/HK.png
TaiWan Nodes = select, include-other-group=Proxy, policy-regex-filter="(?i)(taiwan|tai-wan|台湾|台灣|hinet|chunghwa|seednet|fetnet|fareastone|taiwan mobile|twmbroadband|(^|[-_ =])(cht|tw)($|[-_ =]))", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TW.png
TaiWan = select, TaiWan Nodes, Proxy, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TW.png
AI Suite = select, HomeProxy, TaiWan, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png
CTM = select, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])ctm($|[-_ =])", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
United States = select, include-other-group=Proxy, policy-regex-filter="(?i)(at&t|verizon|comcast|xfinity|spectrum|charter|cox|frontier|centurylink|quantum fiber|optimum|t-mobile|tmobile|(^|[-_ =])(att|us|usa|lax|los angeles|united states|美国)($|[-_ =]))", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/US.png
Japan = select, include-other-group=Proxy, policy-regex-filter="(?i)(softbank|docomo|(^|[-_ =])(ntt|nuro|iij|biglobe|plala|rakuten|ocn|japan|jp|日本)($|[-_ =]))", icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/JP.png
TikTok = select, include-other-group=Proxy, Japan, DIRECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png
Bilibili = select, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bilibili.png
# 亚太聚合组：适合只要求邻近亚洲出口的服务；严格地区需求应直接选择具体国家组。
AsiaPacific = select, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
Others = select, Proxy, DIRECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

[Rule]
# 1. 广告与跟踪：自维护规则 + Sukka 非 IP 规则 + BlackMatrix7 扩展规则。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/reject.list,REJECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT,extended-matching
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising_All_No_Resolve.list,REJECT

# 2. 家庭 Wi-Fi：LacusClyne 下普通流量直连；广告规则仍在本规则之前生效。
SSID,LacusClyne,DIRECT

# 3. 本机与局域网。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/local.list,DIRECT

