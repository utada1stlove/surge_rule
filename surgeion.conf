AI Suite = select, Smart, HomeProxy, TaiWan, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/ai.png
Meta = select, Smart, Singapore, HomeProxy, HongKong, TaiWan, Japan, United States, Proxy, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Whatsapp.png
Twitter = select, Smart, HomeProxy, Singapore, HongKong, TaiWan, Japan, United States, Proxy, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png
Reddit = select, Smart, HomeProxy, Singapore, HongKong, TaiWan, Japan, United States, Proxy, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Reddit.png
CTM = select, Smart, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])ctm($|[-_ =])", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/flags/mo.png
United States = select, Smart, include-other-group=Proxy, policy-regex-filter="(?i)(at&t|verizon|comcast|xfinity|spectrum|charter|cox|frontier|centurylink|quantum fiber|optimum|t-mobile|tmobile|(^|[-_ =])(att|us|usa|lax|los angeles|united states|美国)($|[-_ =]))", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/flags/us.png
Japan = select, Smart, include-other-group=Proxy, policy-regex-filter="(?i)(softbank|docomo|(^|[-_ =])(ntt|nuro|iij|biglobe|plala|rakuten|ocn|japan|jp|日本)($|[-_ =]))", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/flags/jp.png
TikTok = select, Smart, include-other-group=Proxy, Japan, DIRECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/tiktok.png
Bilibili = select, Smart, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/bilibili.png
# 亚太聚合组：适合只要求邻近亚洲出口的服务；严格地区需求应直接选择具体国家组。
AsiaPacific = select, Smart, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/global.png
Others = select, Smart, Proxy, DIRECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/global.png

