#!MANAGED-CONFIG __MANAGED_CONFIG_URL__ interval=86400 strict=false
# @profile: surge-loc
# @version: 1.0.4
# @status: active
# @changed: 2026-09-26
# @changelog: profiles/surge-loc/CHANGELOG.md
# Surge 独立配置模板（由 legacy/surgeion.conf 派生）
# 与 legacy/surgeion.conf 的差异：Telegram 与 NSFW 单独成组（不绑定 UnlimitedTurbo），另有本文件独有的
# Foreign-Apple 与 Google 组；Twitter / Reddit 默认项也不同（本文件 HomeProxy，那边 Singapore）。
# 想手改本文件：Surge 不能修改托管规则，先在 Surge 里复制一份托管配置，副本首行的托管声明会自动消失，
# 之后编辑副本即可；policy-path 仍要换成自己的订阅地址（或把节点直接写进 [Proxy] 段）。详见 docs/knowledge-base/managed-profile-copy-edit.md
# 本文件不修改 legacy/surge-main.conf；节点订阅由私有渲染服务注入。

[General]
# 全局 DNS 候选；Surge 会按自身机制选择可用服务器，不会按规则自动分组。
dns-server = 192.168.100.1, 101.96.200.113:8844, 179.253.254.37:8844, 194.114.138.29:8844, 223.5.5.5, 1.1.1.1, 8.8.8.8
ipv6 = true
# 在具备 IPv6 的网络中让 Surge VIF 处理 IPv6 连接；无 IPv6 的网络自动不启用。
ipv6-vif = auto

[Proxy]

[Proxy Group]

