#!MANAGED-CONFIG __MANAGED_CONFIG_URL__ interval=86400 strict=false
# @profile: surge
# @version: 1.0.1
# @status: active
# @changed: 2026-09-09
# @changelog: profiles/surge/CHANGELOG.md
# Surge 独立配置模板（由 legacy/surgeion.conf 派生）
# 与 legacy/surgeion.conf 的差异：Telegram 与 NSFW 单独成组（不绑定 Boom），另有本文件独有的
# Foreign-Apple 与 Google 组；Twitter / Reddit 默认项也不同（本文件 HomeProxy，那边 Singapore）。
# 想手改本文件：Surge 不能修改托管规则，先在 Surge 里复制一份托管配置，副本首行的托管声明会自动消失，
# 之后编辑副本即可；policy-path 仍要换成自己的订阅地址（或把节点直接写进 Proxy 段）。详见 docs/knowledge-base/managed-profile-copy-edit.md
# 本文件不修改 legacy/surge-main.conf；节点订阅由私有渲染服务注入。

[General]
# 全局 DNS 候选；Surge 会按自身机制选择可用服务器，不会按规则自动分组。
dns-server = 101.96.200.113:8844, 179.253.254.37:8844, 194.114.138.29:8844, 223.5.5.5, 1.1.1.1, 8.8.8.8
ipv6 = true

[Proxy]

[Proxy Group]
# 将占位符替换为自己的 Sub-Store Surge 输出地址。
Proxy = select, policy-path="__SUBSTORE_URL__", update-interval=86400, DIRECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/Surge.png
# 自动测速组：分别覆盖 TX、CFT、美国节点和全体节点。
Smart = url-test, include-other-group=Proxy, policy-regex-filter="(?i)^(?!DIRECT$).+", url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/speed-slow-svgrepo-com.svg
Smart-TX-CFT = url-test, include-other-group=Proxy, policy-regex-filter="(?i)^(?!DIRECT$)(?=.*(^|[-_ =])(tx|cft)($|[-_ =])).+", url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/aws.png
Smart-US = url-test, include-other-group=Proxy, policy-regex-filter="(?i)^(?!DIRECT$)(?=.*(at&t|verizon|comcast|xfinity|spectrum|charter|cox|frontier|centurylink|quantum fiber|optimum|t-mobile|tmobile|(^|[-_ =])(att|us|usa|lax|los angeles|united states|美国)($|[-_ =]))).+", url=https://www.gstatic.com/generate_204, interval=600, tolerance=50, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/services/dmit.banner.png
Domestic = select, Smart, Smart-TX-CFT, Smart-US, DIRECT, Proxy, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/domestic.png
Apple = select, Smart, Smart-TX-CFT, Smart-US, DIRECT, Proxy, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/apple.png
# Apple 非 CN 服务单独成组。
Foreign-Apple = select, Smart, Smart-TX-CFT, Smart-US, HomeProxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Proxy, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/apple.png
# 以下策略组与 legacy/surge-main.conf 同名同义；Foreign-Apple、Google 为本 Profile 独有。
TX = select, Smart, Smart-TX-CFT, Smart-US, REJECT, DIRECT, include-other-group=Proxy, policy-regex-filter="(?i)(^|[-_ =])tx($|[-_ =])", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/tencent.png
Boom = select, Smart, Smart-TX-CFT, Smart-US, include-other-group=Proxy, United States, TX, policy-regex-filter="(?i)(boom|hy2)", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/cloudflare-color.svg
# Boom 是底层的大流量/Hy2 节点池；业务组可以将它作为默认出口。
Cloud Box = select, Smart, Smart-TX-CFT, Smart-US, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/services/dropbox.tile.png
# Telegram 独立成组：候选项不含 Boom，需要 Boom/Hy2 出口时手动从 Proxy 里挑节点。
Telegram = select, Smart, Smart-TX-CFT, Smart-US, Japan, HongKong, Singapore, TaiWan, United States, CTM, HomeProxy, Proxy, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/telegram.png
# NSFW 独立成组；成人内容多为持续大流量，默认项放美国家宽池 Smart-US。
NSFW = select, Smart-US, Smart, Smart-TX-CFT, Japan, HongKong, Singapore, TaiWan, United States, CTM, HomeProxy, Proxy, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/nsfw.png
Twitch = select, Smart, Smart-TX-CFT, Smart-US, Proxy, HongKong, CTM, TaiWan, Singapore, Japan, United States, Boom, DIRECT, REJECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/twitch.png
