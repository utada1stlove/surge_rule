#!MANAGED-CONFIG __MANAGED_CONFIG_URL__ interval=86400 strict=false
# @profile: simple
# @version: 1.0.1
# @status: superseded
# @changed: 2026-09-21
# @changelog: profiles/simple/CHANGELOG.md
# Surge 简单配置模板：保持 DIRECT、Proxy、REJECT 三种最终结果，
# 但将可人工调整的流量分为 Domestic、Apple、Others。
#
# Proxy 通过 policy-path 加载订阅中的多个节点，并可在 Surge 中手动切换。
# 使用前必须替换示例订阅地址；不要把真实订阅 URL 或 Token 提交到公开仓库。

[General]
dns-server = 101.96.200.113:8844, 194.114.138.29:8844, 179.253.254.37:8844
ipv6 = true

[Proxy]
# 节点由下面的 Proxy 策略组从远程订阅动态加载。

[Proxy Group]
# 节点订阅；以下策略组会复用其中当前选定的节点。
Proxy = select, policy-path="__SUBSTORE_URL__", update-interval=86400, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/proxy.png
Smart = smart, include-other-group=Proxy, policy-priority="([Hh][Kk]|[Cc][Tt][Mm]).*[Tt][Xx].*[Vv][Oo][Ll].*[Ii][Xx][Pp]:0.616;([Jj][Pp]|[Ss][Gg]).*[Tt][Xx].*[Vv][Oo][Ll].*[Ii][Xx][Pp]:0.224;[Uu][Ss].*[Tt][Xx].*[Vv][Oo][Ll].*[Ii][Xx][Pp]:0.112;([Hh][Kk]|[Cc][Tt][Mm]).*[Ss][Nn][Ee][Ll][Ll].*([Aa][Ww][Ss]|[Cc][Ff][Tt]):1.32;([Jj][Pp]|[Ss][Gg]).*[Ss][Nn][Ee][Ll][Ll].*([Aa][Ww][Ss]|[Cc][Ff][Tt]):0.48;[Uu][Ss].*[Ss][Nn][Ee][Ll][Ll].*([Aa][Ww][Ss]|[Cc][Ff][Tt]):0.24;([Hh][Kk]|[Cc][Tt][Mm]).*[Tt][Xx].*[Vv][Oo][Ll]:1.232;([Jj][Pp]|[Ss][Gg]).*[Tt][Xx].*[Vv][Oo][Ll]:0.448;[Uu][Ss].*[Tt][Xx].*[Vv][Oo][Ll]:0.224;([Hh][Kk]|[Cc][Tt][Mm]).*[Tt][Xx].*[Hh][Yy]2:1.232;([Jj][Pp]|[Ss][Gg]).*[Tt][Xx].*[Hh][Yy]2:0.448;[Uu][Ss].*[Tt][Xx].*[Hh][Yy]2:0.224;([Hh][Kk]|[Cc][Tt][Mm]).*[Vv][Oo][Ll].*[Hh][Yy]2:1.408;([Jj][Pp]|[Ss][Gg]).*[Vv][Oo][Ll].*[Hh][Yy]2:0.512;[Uu][Ss].*[Vv][Oo][Ll].*[Hh][Yy]2:0.256;([Hh][Kk]|[Cc][Tt][Mm]).*[Ss][Nn][Ee][Ll][Ll].*[Tt][Xx]:1.232;([Jj][Pp]|[Ss][Gg]).*[Ss][Nn][Ee][Ll][Ll].*[Tt][Xx]:0.448;[Uu][Ss].*[Ss][Nn][Ee][Ll][Ll].*[Tt][Xx]:0.224;([Hh][Kk]|[Cc][Tt][Mm]).*[Ss][Nn][Ee][Ll][Ll].*[Ii][Xx][Pp]:1.1;([Jj][Pp]|[Ss][Gg]).*[Ss][Nn][Ee][Ll][Ll].*[Ii][Xx][Pp]:0.4;[Uu][Ss].*[Ss][Nn][Ee][Ll][Ll].*[Ii][Xx][Pp]:0.2;([Hh][Kk]|[Cc][Tt][Mm]).*[Vv][Oo][Ll].*[Ii][Xx][Pp]:0.88;([Jj][Pp]|[Ss][Gg]).*[Vv][Oo][Ll].*[Ii][Xx][Pp]:0.32;[Uu][Ss].*[Vv][Oo][Ll].*[Ii][Xx][Pp]:0.16;([Hh][Kk]|[Cc][Tt][Mm]).*[Ss][Nn][Ee][Ll][Ll]:1.76;([Jj][Pp]|[Ss][Gg]).*[Ss][Nn][Ee][Ll][Ll]:0.64;[Uu][Ss].*[Ss][Nn][Ee][Ll][Ll]:0.32;([Hh][Kk]|[Cc][Tt][Mm]).*[Tt][Xx]:1.54;([Jj][Pp]|[Ss][Gg]).*[Tt][Xx]:0.56;[Uu][Ss].*[Tt][Xx]:0.28;([Hh][Kk]|[Cc][Tt][Mm]).*[Vv][Oo][Ll]:1.76;([Jj][Pp]|[Ss][Gg]).*[Vv][Oo][Ll]:0.64;[Uu][Ss].*[Vv][Oo][Ll]:0.32;([Hh][Kk]|[Cc][Tt][Mm]).*[Hh][Yy]2:1.76;([Jj][Pp]|[Ss][Gg]).*[Hh][Yy]2:0.64;[Uu][Ss].*[Hh][Yy]2:0.32;([Hh][Kk]|[Cc][Tt][Mm]).*([Aa][Ww][Ss]|[Cc][Ff][Tt]):1.65;([Jj][Pp]|[Ss][Gg]).*([Aa][Ww][Ss]|[Cc][Ff][Tt]):0.6;[Uu][Ss].*([Aa][Ww][Ss]|[Cc][Ff][Tt]):0.3;([Hh][Kk]|[Cc][Tt][Mm]).*[Ii][Xx][Pp]:1.1;([Jj][Pp]|[Ss][Gg]).*[Ii][Xx][Pp]:0.4;[Uu][Ss].*[Ii][Xx][Pp]:0.2;([Hh][Kk]|[Cc][Tt][Mm]):2.2;([Jj][Pp]|[Ss][Gg]):0.8;[Uu][Ss]:0.4;[Ss][Nn][Ee][Ll][Ll].*[Tt][Xx]:0.56;[Tt][Xx].*[Vv][Oo][Ll]:0.56;[Vv][Oo][Ll].*[Hh][Yy]2:0.64;([Aa][Ww][Ss]|[Cc][Ff][Tt]).*[Ii][Xx][Pp]:0.375;[Ii][Xx][Pp]:0.5;[Ss][Nn][Ee][Ll][Ll]:0.8;[Tt][Xx]:0.7;[Vv][Oo][Ll]:0.8;[Hh][Yy]2:0.8;([Aa][Ww][Ss]|[Cc][Ff][Tt]):0.75;.*:1.0", icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/proxy.png
# 国内服务默认直连；需要时可在 Surge 中切换到 Proxy。
Domestic = select, Smart, DIRECT, Proxy, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/domestic.png
# Apple 服务默认直连；App Store 等出现区域或连通性问题时可切换到 Proxy。
Apple = select, Smart, DIRECT, Proxy, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/apple.png
# 未分类流量默认代理；诊断时可手动切换到 DIRECT。
Others = select, Smart, Proxy, DIRECT, icon-url=https://raw.githubusercontent.com/utada1stlove/surge_rule/main/assets/icons/policy/global.png

[Rule]
# 明确拒绝优先于其他分类，避免广告域名被国内规则放行。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/reject.list,REJECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising_All_No_Resolve.list,REJECT

# 局域网与本机地址始终直连，不受策略组选择影响。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/local.list,DIRECT

# 国内服务默认直连；可以在 Domestic 组中临时改走 Proxy。
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/direct.list,Domestic
RULE-SET,https://raw.githubusercontent.com/utada1stlove/surge_rule/main/rules/generated/cn.list,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,Domestic,extended-matching
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip.conf,Domestic
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/google-cn.txt,Domestic

# Apple 默认直连；可以在 Apple 组中改走 Proxy。
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,Apple,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,Apple,extended-matching

# 其余流量进入 Others；默认代理，诊断时可手动直连。
FINAL,Others
